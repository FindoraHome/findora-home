<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FindoraHome</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    header {
      background: white;
      text-align: center;
      padding: 22px 20px;
      border-bottom: 1px solid #ddd;
    }

    header h1 {
      margin: 0;
      font-size: 38px;
    }

    header p {
      margin: 8px 0 0;
      color: #555;
      font-size: 18px;
    }

    main {
      max-width: 1400px;
      margin: auto;
      padding: 32px 40px;
    }

    #search {
      width: 100%;
      padding: 17px 20px;
      font-size: 18px;
      border: 1px solid #ccc;
      border-radius: 12px;
      background: white;
      outline: none;
    }

    #search:focus {
      border-color: #222;
    }

    #categories {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 25px 0 32px;
    }

    .category-button {
      padding: 11px 20px;
      border: 1px solid #ddd;
      border-radius: 25px;
      background: white;
      font-size: 16px;
      cursor: pointer;
    }

    .category-button.active {
      background: #222;
      color: white;
      border-color: #222;
    }

    #products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    .product-card {
      background: white;
      border: 1px solid #e2e2e2;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.04);
    }

    .product-image {
      display: block;
      width: 100%;
      height: 220px;
      object-fit: contain;
      margin-bottom: 18px;
      border-radius: 10px;
    }

    .category-label {
      display: inline-block;
      background: #f0f0f0;
      border-radius: 14px;
      padding: 6px 11px;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .product-card h2 {
      margin: 0 0 12px;
      font-size: 23px;
    }

    .description {
      margin: 0 0 18px;
      line-height: 1.5;
      color: #444;
      font-size: 16px;
    }

    .product-link {
      display: inline-block;
      background: #222;
      color: white;
      text-decoration: none;
      padding: 11px 18px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    .product-link:hover {
      background: #444;
    }

    .message {
      grid-column: 1 / -1;
      text-align: center;
      padding: 30px;
      color: #666;
    }

    footer {
      text-align: center;
      padding: 35px;
      color: #666;
    }

    @media (max-width: 750px) {
      main {
        padding: 25px 18px;
      }

      #products {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>FindoraHome</h1>
  <p>Finde Produkte für dein Zuhause</p>
</header>

<main>

  <input
    id="search"
    type="text"
    placeholder="Produkt, Kategorie oder Stichwort suchen..."
  >

  <div id="categories"></div>

  <div id="products">
    <div class="message">Produkte werden geladen...</div>
  </div>

</main>

<footer>
  © FindoraHome
</footer>

<script>
  const SUPABASE_URL =
    "https://wcpifcdwomjzmvnvgqwr.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_E2eo9QKlcUtWkpVuRPOmPw_n95EvT0i";

  let products = [];
  let selectedCategory = "Alle";

  const productsContainer =
    document.getElementById("products");

  const categoriesContainer =
    document.getElementById("categories");

  const searchInput =
    document.getElementById("search");


  async function loadProducts() {
    try {

      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/products?select=*&active=eq.true&order=id.asc`,
        {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`
          }
        }
      );

      if (!response.ok) {
        throw new Error("Fehler beim Laden");
      }

      products = await response.json();

      createCategories();
      renderProducts();

    } catch (error) {
      console.error(error);

      productsContainer.innerHTML =
        '<div class="message">Produkte konnten nicht geladen werden.</div>';
    }
  }


  function createCategories() {

    const categories = [
      "Alle",
      ...new Set(
        products
          .map(product => product.category)
          .filter(Boolean)
      )
    ];

    categoriesContainer.innerHTML = "";

    categories.forEach(category => {

      const button = document.createElement("button");

      button.className = "category-button";

      if (category === selectedCategory) {
        button.classList.add("active");
      }

      button.textContent = category;

      button.addEventListener("click", function () {
        selectedCategory = category;
        createCategories();
        renderProducts();
      });

      categoriesContainer.appendChild(button);
    });
  }


  function renderProducts() {

    const search =
      searchInput.value.trim().toLowerCase();

    const filtered = products.filter(product => {

      const searchableText = [
        product.name,
        product.category,
        product.description,
        product.keywords
      ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();

      const matchesSearch =
        searchableText.includes(search);

      const matchesCategory =
        selectedCategory === "Alle" ||
        product.category === selectedCategory;

      return matchesSearch && matchesCategory;
    });


    productsContainer.innerHTML = "";


    if (filtered.length === 0) {
      productsContainer.innerHTML =
        '<div class="message">Kein passendes Produkt gefunden.</div>';

      return;
    }


    filtered.forEach(product => {

      const card = document.createElement("div");
      card.className = "product-card";


      if (product.image_url) {

        const image = document.createElement("img");

        image.className = "product-image";
        image.src = product.image_url;
        image.alt = product.name || "Produkt";
        image.loading = "lazy";

        image.onerror = function () {
          this.style.display = "none";
        };

        card.appendChild(image);
      }


      if (product.category) {

        const category = document.createElement("div");

        category.className = "category-label";
        category.textContent = product.category;

        card.appendChild(category);
      }


      const title = document.createElement("h2");

      title.textContent =
        product.name || "Produkt";

      card.appendChild(title);


      if (product.description) {

        const description = document.createElement("p");

        description.className = "description";
        description.textContent = product.description;

        card.appendChild(description);
      }


      if (product.link) {

        const button = document.createElement("a");

        button.className = "product-link";

        button.href = product.link;

        button.target = "_blank";

        button.rel = "noopener noreferrer";

        button.textContent = "Zum Produkt →";

        card.appendChild(button);
      }


      productsContainer.appendChild(card);
    });
  }


  searchInput.addEventListener(
    "input",
    renderProducts
  );


  loadProducts();
</script>

</body>
</html>
