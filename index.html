<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FindoraHome</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f7f7f7;
  color:#222;
}

header{
  background:white;
  text-align:center;
  padding:18px;
  border-bottom:1px solid #ddd;
}

.logo{
  font-size:36px;
  margin-bottom:4px;
}

h1{
  margin:0;
  font-size:30px;
}

header p{
  margin:5px 0 0;
  color:#666;
  font-size:14px;
}

main{
  max-width:1400px;
  margin:auto;
  padding:24px;
}

#search{
  width:100%;
  height:46px;
  padding:0 15px;
  font-size:15px;
  border:1px solid #ccc;
  border-radius:10px;
  outline:none;
  background:white;
}

#categories{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:15px 0 20px;
}

.category{
  border:1px solid #ddd;
  background:white;
  padding:7px 13px;
  border-radius:20px;
  cursor:pointer;
  font-size:13px;
}

.category.active{
  background:#222;
  color:white;
}

/* EXAKT 4 KARTEN AM PC */

#products{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:15px;
}

.card{
  background:white;
  border:1px solid #ddd;
  border-radius:12px;
  overflow:hidden;
  min-width:0;
  display:flex;
  flex-direction:column;
}

/* PRODUKTBILD */

.image-box{
  width:100%;
  height:145px;
  background:#fafafa;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid #eee;
}

.image-box img{
  width:100%;
  height:100%;
  object-fit:contain;
  padding:8px;
}

.no-image{
  color:#aaa;
  font-size:12px;
}

.content{
  padding:12px;
  display:flex;
  flex-direction:column;
  flex:1;
}

.tag{
  width:max-content;
  max-width:100%;
  background:#eee;
  padding:4px 8px;
  border-radius:10px;
  font-size:11px;
  margin-bottom:7px;
}

.card h2{
  margin:0 0 7px;
  font-size:17px;
}

.card p{
  margin:0 0 12px;
  color:#666;
  font-size:13px;
  line-height:1.4;
}

.product-button{
  display:block;
  margin-top:auto;
  background:#222;
  color:white;
  text-decoration:none;
  text-align:center;
  padding:9px;
  border-radius:7px;
  font-size:13px;
  font-weight:bold;
}

.product-button:hover{
  background:#444;
}

.message{
  grid-column:1/-1;
  text-align:center;
  padding:30px;
  color:#777;
}

/* TABLET */

@media(max-width:900px){
  #products{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

/* HANDY */

@media(max-width:500px){
  main{
    padding:15px;
  }

  #products{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>

  <!-- LOGO ÜBER FINDORAHOME -->
  <div class="logo">🏠</div>

  <h1>FindoraHome</h1>

  <p>Finde Produkte für dein Zuhause</p>

</header>

<main>

<input
  id="search"
  type="search"
  placeholder="Produkt, Kategorie oder Stichwort suchen..."
>

<div id="categories"></div>

<div id="products">
  <div class="message">Produkte werden geladen...</div>
</div>

</main>

<script>

const SUPABASE_URL =
"https://wcpifcdwomjzmvnvgqwr.supabase.co";

const SUPABASE_KEY =
"sb_publishable_E2eo9QKlcUtWkpVuRPOmPw_n95EvT0i";

let products = [];
let category = "Alle";

const productBox =
document.getElementById("products");

const categoryBox =
document.getElementById("categories");

const search =
document.getElementById("search");


async function loadProducts(){

  try{

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/products?select=*&active=eq.true&order=id.asc",
      {
        headers:{
          apikey:SUPABASE_KEY,
          Authorization:"Bearer " + SUPABASE_KEY
        }
      }
    );

    if(!response.ok){
      throw new Error("Produkte konnten nicht geladen werden");
    }

    products = await response.json();

    makeCategories();
    showProducts();

  }catch(error){

    console.error(error);

    productBox.innerHTML =
    '<div class="message">Produkte konnten nicht geladen werden.</div>';

  }
}


function makeCategories(){

  const categories = [
    "Alle",
    ...new Set(
      products
      .map(p => p.category)
      .filter(Boolean)
    )
  ];

  categoryBox.innerHTML = "";

  categories.forEach(name => {

    const button =
    document.createElement("button");

    button.className = "category";

    if(name === category){
      button.classList.add("active");
    }

    button.textContent = name;

    button.onclick = () => {
      category = name;
      makeCategories();
      showProducts();
    };

    categoryBox.appendChild(button);

  });

}


function showProducts(){

  const text =
  search.value.trim().toLowerCase();

  const filtered =
  products.filter(product => {

    const searchable = [
      product.name,
      product.category,
      product.description,
      product.keywords
    ]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();

    const correctCategory =
    category === "Alle" ||
    product.category === category;

    return (
      correctCategory &&
      searchable.includes(text)
    );

  });


  productBox.innerHTML = "";


  if(filtered.length === 0){

    productBox.innerHTML =
    '<div class="message">Kein Produkt gefunden.</div>';

    return;
  }


  filtered.forEach(product => {

    const card =
    document.createElement("div");

    card.className = "card";


    /* BILD */

    const imageBox =
    document.createElement("div");

    imageBox.className = "image-box";


    if(product.image_url){

      const img =
      document.createElement("img");

      img.src = product.image_url;
      img.alt = product.name || "Produkt";
      img.loading = "lazy";

      img.onerror = () => {
        imageBox.innerHTML =
        '<span class="no-image">Bild nicht verfügbar</span>';
      };

      imageBox.appendChild(img);

    }else{

      imageBox.innerHTML =
      '<span class="no-image">Bild fehlt</span>';

    }


    card.appendChild(imageBox);


    /* INHALT */

    const content =
    document.createElement("div");

    content.className = "content";


    if(product.category){

      const tag =
      document.createElement("div");

      tag.className = "tag";
      tag.textContent = product.category;

      content.appendChild(tag);

    }


    const title =
    document.createElement("h2");

    title.textContent =
    product.name || "Produkt";

    content.appendChild(title);


    if(product.description){

      const description =
      document.createElement("p");

      description.textContent =
      product.description;

      content.appendChild(description);

    }


    /* ANKLICKBARER LINK */

    if(product.link){

      const link =
      document.createElement("a");

      link.className =
      "product-button";

      link.href =
      product.link;

      link.target =
      "_blank";

      link.rel =
      "noopener noreferrer sponsored";

      link.textContent =
      "Zum Produkt →";

      content.appendChild(link);

    }


    card.appendChild(content);

    productBox.appendChild(card);

  });

}


search.addEventListener(
  "input",
  showProducts
);


loadProducts();

</script>

</body>
</html>
