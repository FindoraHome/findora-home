<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FindoraHome</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    header {
      background: white;
      text-align: center;
      padding: 22px 20px 28px;
      border-bottom: 1px solid #ddd;
    }

    header h1 {
      margin: 0;
      font-size: 48px;
    }

    header p {
      margin: 10px 0 0;
      font-size: 24px;
      color: #555;
    }

    main {
      max-width: 1750px;
      margin: auto;
      padding: 40px 48px;
    }

    #search {
      width: 100%;
      padding: 22px;
      font-size: 23px;
      border: 1px solid #ccc;
      border-radius: 16px;
      outline: none;
      background: white;
    }

    #search:focus {
      border-color: #111;
    }

    #categories {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin: 36px 0 44px;
    }

    .category-button {
      border: 1px solid #ddd;
      background: white;
      padding: 14px 24px;
      border-radius: 30px;
      font-size: 18px;
      cursor: pointer;
    }

    .category-button:hover {
      background: #eee;
    }

    .category-button.active {
      background: #222;
      color: white;
    }

    #products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 30px;
    }

    .product-card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      min-height: 280px;
    }

    .product-image {
      width: 100%;
      height: 260px;
      object-fit: contain;
      border-radius: 14px;
      margin-bottom: 20px;
      background: #fafafa;
    }

    .category-label {
      display: inline-block;
      width: fit-content;
      background: #f0f0f0;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 17px;
      margin-bottom: 12px;
    }

    .product-card h2 {
      margin: 0 0 16px;
      font-size: 28px;
    }

    .description {
      font-size: 19px;
      line-height: 1.6;
      color: #444;
      margin: 0 0 24px;
    }

    .product-link {
      display: inline-block;
      width: fit-content;
      margin-top: auto;
      padding: 14px 22px;
      background: #222;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    .product-link:hover {
      background: #444;
    }

    #loading,
    #noResults,
    #errorMessage {
      text-align: center;
      padding: 50px 20px;
      font-size: 20px;
    }

    #noResults,
    #errorMessage {
      display: none;
    }

    #errorMessage {
      color: #a00;
    }

    footer {
      text-align: center;
      color: #666;
      font-size: 18px;
      padding: 50px 20px;
    }

    @media (max-width: 850px) {
      header h1 {
        font-size: 36px;
      }

      header p {
        font-size: 19px;
      }

      main {
        padding: 25px 18px;
      }

      #products {
        grid-template-columns: 1fr;
      }

      #search {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>FindoraHome</h1>
  <p>Finde Produkte für dein Zuhause</p>
</header>

<main>

  <input
    id="search"
    type="text"
    placeholder="Produkt, Kategorie oder Stichwort suchen..."
  >

  <div id="categories"></div>

  <div id="loading">
    Produkte werden geladen...
  </div>

  <div id="errorMessage">
    Die Produkte konnten nicht geladen werden.
  </div>

  <div id="products"></div>

  <div id="noResults">
    Kein passendes Produkt gefunden.
  </div>

</main>

<footer>
  © FindoraHome
</footer>


<script>

  /* ==========================================
     SUPABASE
     ========================================== */

  const SUPABASE_URL =
    "https://wcpifcdwomjzmvnvgqwr.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_E2eo9QKlcUtWkpVuRPOmPw_n95EvT0i";


  /* ==========================================
     VARIABLEN
     ========================================== */

  let products = [];
  let selectedCategory = "Alle";

  const productsContainer =
    document.getElementById("products");

  const categoriesContainer =
    document.getElementById("categories");

  const searchInput =
    document.getElementById("search");

  const loading =
    document.getElementById("loading");

  const noResults =
    document.getElementById("noResults");

  const errorMessage =
    document.getElementById("errorMessage");


  /* ==========================================
     PRODUKTE AUS SUPABASE LADEN
     ========================================== */

  async function loadProducts() {

    loading.style.display = "block";
    errorMessage.style.display = "none";

    try {

      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/products?select=*&active=eq.true&order=created_at.desc`,
        {
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${SUPABASE_KEY}`
          }
        }
      );

      if (!response.ok) {
        throw new Error(
          "Supabase Fehler: " + response.status
        );
      }

      products = await response.json();

      loading.style.display = "none";

      createCategories();
      renderProducts();

    } catch (error) {

      console.error(error);

      loading.style.display = "none";
      errorMessage.style.display = "block";

    }

  }


  /* ==========================================
     KATEGORIEN
     ========================================== */

  function createCategories() {

    categoriesContainer.innerHTML = "";

    const categories = [
      "Alle",
      ...new Set(
        products
          .map(product => product.category)
          .filter(Boolean)
      )
    ];

    categories.forEach(category => {

      const button =
        document.createElement("button");

      button.className = "category-button";

      if (category === selectedCategory) {
        button.classList.add("active");
      }

      button.textContent = category;

      button.addEventListener("click", () => {

        selectedCategory = category;

        createCategories();
        renderProducts();

      });

      categoriesContainer.appendChild(button);

    });

  }


  /* ==========================================
     PRODUKTE ANZEIGEN
     ========================================== */

  function renderProducts() {

    const search =
      searchInput.value
        .toLowerCase()
        .trim();

    const filtered = products.filter(product => {

      const name =
        (product.name || "").toLowerCase();

      const category =
        (product.category || "").toLowerCase();

      const description =
        (product.description || "").toLowerCase();

      const keywords =
        (product.keywords || "").toLowerCase();

      const matchesSearch =
        name.includes(search) ||
        category.includes(search) ||
        description.includes(search) ||
        keywords.includes(search);

      const matchesCategory =
        selectedCategory === "Alle" ||
        product.category === selectedCategory;

      return matchesSearch && matchesCategory;

    });


    productsContainer.innerHTML = "";


    filtered.forEach(product => {

      const card =
        document.createElement("div");

      card.className = "product-card";


      /* PRODUKTBILD */

      if (product.image_url) {

        const image =
          document.createElement("img");

        image.className = "product-image";
        image.src = product.image_url;
        image.alt = product.name || "Produkt";

        card.appendChild(image);

      }


      /* KATEGORIE */

      if (product.category) {

        const category =
          document.createElement("div");

        category.className = "category-label";
        category.textContent = product.category;

        card.appendChild(category);

      }


      /* NAME */

      const title =
        document.createElement("h2");

      title.textContent =
        product.name || "Produkt";

      card.appendChild(title);


      /* BESCHREIBUNG */

      if (product.description) {

        const description =
          document.createElement("p");

        description.className = "description";
        description.textContent =
          product.description;

        card.appendChild(description);

      }


      /* PRODUKTLINK */

      if (product.url) {

        const link =
          document.createElement("a");

        link.className = "product-link";

        link.href = product.url;

        link.target = "_blank";

        link.rel =
          "noopener noreferrer sponsored";

        link.textContent =
          "Zum Produkt →";

        card.appendChild(link);

      }


      productsContainer.appendChild(card);

    });


    noResults.style.display =
      filtered.length === 0
        ? "block"
        : "none";

  }


  /* ==========================================
     SUCHE
     ========================================== */

  searchInput.addEventListener(
    "input",
    renderProducts
  );


  /* ==========================================
     START
     ========================================== */

  loadProducts();

</script>

</body>
</html>
