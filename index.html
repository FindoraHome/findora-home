<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FindoraHome</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f7f7f7;
  color: #222;
}

/* HEADER */

header {
  background: white;
  text-align: center;
  padding: 22px 15px 20px;
  border-bottom: 1px solid #e5e5e5;
}

.logo {
  width: 60px;
  height: 60px;
  margin: 0 auto 7px;
  border-radius: 18px;
  background: #eee9df;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 31px;
}

header h1 {
  margin: 0;
  font-size: 32px;
}

header p {
  margin: 6px 0 0;
  color: #666;
  font-size: 15px;
}

/* SEITE */

main {
  max-width: 1400px;
  margin: auto;
  padding: 25px 25px 40px;
}

/* SUCHE */

#search {
  width: 100%;
  height: 48px;
  padding: 0 17px;

  background: white;

  border: 1px solid #d5d5d5;
  border-radius: 11px;

  font-size: 15px;
  outline: none;
}

#search:focus {
  border-color: #555;
}

/* KATEGORIEN */

#categories {
  display: flex;
  gap: 8px;

  overflow-x: auto;

  padding: 16px 0 20px;

  scrollbar-width: none;
}

#categories::-webkit-scrollbar {
  display: none;
}

.category-button {
  flex: 0 0 auto;

  border: 1px solid #ddd;

  background: white;

  padding: 8px 14px;

  border-radius: 20px;

  font-size: 13px;

  cursor: pointer;
}

.category-button.active {
  background: #222;
  color: white;
  border-color: #222;
}

/* PRODUKTRASTER */

#products {
  display: grid;

  grid-template-columns:
    repeat(4, minmax(0, 1fr));

  gap: 14px;
}

/* PRODUKT */

.product-card {
  min-width: 0;

  background: white;

  border: 1px solid #e4e4e4;

  border-radius: 14px;

  overflow: hidden;

  display: flex;
  flex-direction: column;

  box-shadow: 0 2px 8px rgba(0,0,0,.035);
}

/* BILD */

.image-area {
  height: 150px;

  background: #fafafa;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;

  border-bottom: 1px solid #f0f0f0;
}

.product-image {
  width: 100%;
  height: 100%;

  object-fit: contain;

  padding: 8px;
}

.no-image {
  color: #aaa;
  font-size: 12px;
}

/* PRODUKTINHALT */

.product-content {
  padding: 13px;

  display: flex;
  flex-direction: column;

  flex: 1;
}

.category-label {
  align-self: flex-start;

  background: #f1f1f1;

  color: #555;

  padding: 4px 8px;

  border-radius: 10px;

  font-size: 11px;

  margin-bottom: 7px;
}

.product-card h2 {
  margin: 0 0 7px;

  font-size: 17px;

  line-height: 1.25;
}

.description {
  margin: 0 0 12px;

  color: #666;

  font-size: 13px;

  line-height: 1.4;
}

/* PRODUKTBUTTON */

.product-link {
  display: block;

  width: 100%;

  margin-top: auto;

  padding: 9px 8px;

  background: #222;

  color: white;

  text-align: center;

  text-decoration: none;

  border-radius: 7px;

  font-size: 13px;

  font-weight: bold;
}

.product-link:hover {
  background: #444;
}

.message {
  grid-column: 1 / -1;

  padding: 35px;

  text-align: center;

  color: #777;
}

/* FOOTER */

footer {
  padding: 30px;

  text-align: center;

  color: #888;

  font-size: 12px;
}

/* TABLET */

@media (max-width: 950px) {

  #products {
    grid-template-columns:
      repeat(3, minmax(0, 1fr));
  }

}

/* KLEINERES TABLET */

@media (max-width: 700px) {

  main {
    padding: 20px 14px 35px;
  }

  #products {
    grid-template-columns:
      repeat(2, minmax(0, 1fr));
  }

}

/* HANDY */

@media (max-width: 450px) {

  header {
    padding-top: 17px;
  }

  .logo {
    width: 52px;
    height: 52px;
    font-size: 27px;
  }

  header h1 {
    font-size: 27px;
  }

  header p {
    font-size: 13px;
  }

  #products {
    grid-template-columns: 1fr;
  }

  .image-area {
    height: 180px;
  }

}

</style>
</head>

<body>

<header>

  <!-- VORLÄUFIGES LOGO -->
  <div class="logo">
    ♡
  </div>

  <h1>FindoraHome</h1>

  <p>
    Finde Produkte für dein Zuhause
  </p>

</header>


<main>

  <input
    id="search"
    type="search"
    placeholder="🔎 Produkt, Kategorie oder Stichwort suchen..."
    autocomplete="off"
  >

  <div id="categories"></div>

  <div id="products">

    <div class="message">
      Produkte werden geladen...
    </div>

  </div>

</main>


<footer>
  © FindoraHome
</footer>


<script>

/* SUPABASE */

const SUPABASE_URL =
  "https://wcpifcdwomjzmvnvgqwr.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_E2eo9QKlcUtWkpVuRPOmPw_n95EvT0i";


let products = [];

let selectedCategory =
  "Alle";


const productsContainer =
  document.getElementById("products");

const categoriesContainer =
  document.getElementById("categories");

const searchInput =
  document.getElementById("search");


/* PRODUKTE LADEN */

async function loadProducts() {

  try {

    const response = await fetch(

      `${SUPABASE_URL}/rest/v1/products?select=*&active=eq.true&order=id.asc`,

      {
        headers: {

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            `Bearer ${SUPABASE_KEY}`

        }
      }

    );


    if (!response.ok) {

      throw new Error(
        "Fehler beim Laden der Produkte."
      );

    }


    products =
      await response.json();


    createCategories();

    renderProducts();


  } catch (error) {

    console.error(error);

    productsContainer.innerHTML =

      `<div class="message">
        Produkte konnten nicht geladen werden.
      </div>`;

  }

}


/* KATEGORIEN */

function createCategories() {

  const categories = [

    "Alle",

    ...new Set(

      products

        .map(
          product =>
            product.category
        )

        .filter(Boolean)

    )

  ];


  categoriesContainer.innerHTML =
    "";


  categories.forEach(
    category => {


      const button =
        document.createElement(
          "button"
        );


      button.className =
        "category-button";


      button.textContent =
        category;


      if (
        category ===
        selectedCategory
      ) {

        button.classList.add(
          "active"
        );

      }


      button.onclick = () => {

        selectedCategory =
          category;

        createCategories();

        renderProducts();

      };


      categoriesContainer
        .appendChild(button);

    }

  );

}


/* PRODUKTE ANZEIGEN */

function renderProducts() {

  const search =
    searchInput
      .value
      .trim()
      .toLowerCase();


  const filtered =
    products.filter(
      product => {


        const searchableText = [

          product.name,

          product.category,

          product.description,

          product.keywords

        ]

        .filter(Boolean)

        .join(" ")

        .toLowerCase();


        const matchesSearch =
          searchableText.includes(
            search
          );


        const matchesCategory =

          selectedCategory ===
            "Alle"

          ||

          product.category ===
            selectedCategory;


        return (
          matchesSearch &&
          matchesCategory
        );

      }

    );


  productsContainer.innerHTML =
    "";


  if (
    filtered.length === 0
  ) {

    productsContainer.innerHTML =

      `<div class="message">
        Kein passendes Produkt gefunden.
      </div>`;

    return;

  }


  filtered.forEach(
    product => {


      const card =
        document.createElement(
          "article"
        );


      card.className =
        "product-card";


      /* BILD */

      const imageArea =
        document.createElement(
          "div"
        );


      imageArea.className =
        "image-area";


      if (product.image_url) {


        const image =
          document.createElement(
            "img"
          );


        image.className =
          "product-image";


        image.src =
          product.image_url;


        image.alt =
          product.name ||
          "Produkt";


        image.loading =
          "lazy";


        image.onerror = () => {

          imageArea.innerHTML =

            `<div class="no-image">
              Kein Bild
            </div>`;

        };


        imageArea.appendChild(
          image
        );


      } else {


        imageArea.innerHTML =

          `<div class="no-image">
            Kein Bild
          </div>`;

      }


      card.appendChild(
        imageArea
      );


      /* INHALT */

      const content =
        document.createElement(
          "div"
        );


      content.className =
        "product-content";


      /* KATEGORIE */

      if (product.category) {


        const category =
          document.createElement(
            "div"
          );


        category.className =
          "category-label";


        category.textContent =
          product.category;


        content.appendChild(
          category
        );

      }


      /* PRODUKTNAME */

      const title =
        document.createElement(
          "h2"
        );


      title.textContent =
        product.name ||
        "Produkt";


      content.appendChild(
        title
      );


      /* BESCHREIBUNG */

      if (product.description) {


        const description =
          document.createElement(
            "p"
          );


        description.className =
          "description";


        description.textContent =
          product.description;


        content.appendChild(
          description
        );

      }


      /* PRODUKTLINK */

      if (product.link) {


        const link =
          document.createElement(
            "a"
          );


        link.className =
          "product-link";


        link.href =
          product.link;


        link.target =
          "_blank";


        link.rel =
          "noopener noreferrer sponsored";


        link.textContent =
          "Zum Produkt →";


        content.appendChild(
          link
        );

      }


      card.appendChild(
        content
      );


      productsContainer
        .appendChild(card);

    }

  );

}


/* SUCHE */

searchInput.addEventListener(
  "input",
  renderProducts
);


/* START */

loadProducts();

</script>

</body>
</html>
