<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FindoraHome</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    header {
      background: white;
      text-align: center;
      padding: 25px 20px;
      border-bottom: 1px solid #ddd;
    }

    header h1 {
      margin: 0;
      font-size: 46px;
    }

    header p {
      margin: 10px 0 0;
      font-size: 23px;
      color: #555;
    }

    main {
      max-width: 1750px;
      margin: auto;
      padding: 40px 45px;
    }

    #search {
      width: 100%;
      padding: 22px;
      font-size: 23px;
      border: 1px solid #ccc;
      border-radius: 15px;
      outline: none;
      background: white;
    }

    #search:focus {
      border: 2px solid #1267d6;
    }

    #categories {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 35px;
      margin-bottom: 45px;
    }

    .category-button {
      border: 1px solid #ddd;
      background: white;
      padding: 14px 24px;
      border-radius: 30px;
      font-size: 18px;
      cursor: pointer;
    }

    .category-button:hover {
      background: #eeeeee;
    }

    .category-button.active {
      background: #222;
      color: white;
      border-color: #222;
    }

    #products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 30px;
    }

    .product-card {
      background: white;
      border: 1px solid #e2e2e2;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
    }

    .product-image {
      width: 100%;
      height: 320px;
      object-fit: contain;
      background: white;
      padding: 15px;
    }

    .product-content {
      padding: 27px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .category-label {
      display: inline-block;
      align-self: flex-start;
      background: #f0f0f0;
      border-radius: 15px;
      padding: 7px 13px;
      font-size: 16px;
      margin-bottom: 12px;
    }

    .product-card h2 {
      font-size: 28px;
      margin: 0 0 15px;
    }

    .description {
      font-size: 20px;
      line-height: 1.5;
      color: #444;
      margin: 0 0 25px;
    }

    .product-link {
      display: inline-block;
      align-self: flex-start;
      margin-top: auto;
      padding: 14px 24px;
      background: #222;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    .product-link:hover {
      background: #444;
    }

    .loading,
    .no-results,
    .error {
      grid-column: 1 / -1;
      text-align: center;
      font-size: 20px;
      padding: 40px;
      color: #666;
    }

    footer {
      text-align: center;
      padding: 40px 20px;
      color: #666;
      font-size: 18px;
    }

    @media (max-width: 800px) {
      header h1 {
        font-size: 34px;
      }

      header p {
        font-size: 18px;
      }

      main {
        padding: 25px 18px;
      }

      #products {
        grid-template-columns: 1fr;
      }

      .product-image {
        height: 260px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>FindoraHome</h1>
  <p>Finde Produkte für dein Zuhause</p>
</header>

<main>

  <input
    id="search"
    type="text"
    placeholder="Produkt, Kategorie oder Stichwort suchen..."
  >

  <div id="categories"></div>

  <div id="products">
    <div class="loading">Produkte werden geladen...</div>
  </div>

</main>

<footer>
  © FindoraHome
</footer>


<script>

  const SUPABASE_URL =
    "https://wcpifcdwomjzmvnvgqwr.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_E2eo9QKlcUtWkpVuRPOmPw_n95EvT0i";


  let products = [];
  let selectedCategory = "Alle";


  const productsContainer =
    document.getElementById("products");

  const categoriesContainer =
    document.getElementById("categories");

  const searchInput =
    document.getElementById("search");


  async function loadProducts() {

    productsContainer.innerHTML =
      '<div class="loading">Produkte werden geladen...</div>';

    try {

      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/products?select=*&active=eq.true&order=id.asc`,
        {
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${SUPABASE_KEY}`
          }
        }
      );


      if (!response.ok) {
        throw new Error(
          "Supabase Fehler: " + response.status
        );
      }


      products = await response.json();


      createCategories();
      renderProducts();


    } catch (error) {

      console.error(error);

      productsContainer.innerHTML = `
        <div class="error">
          Produkte konnten nicht geladen werden.
        </div>
      `;
    }
  }



  function createCategories() {

    const categories = [
      "Alle",
      ...new Set(
        products
          .map(product => product.category)
          .filter(Boolean)
      )
    ];


    categoriesContainer.innerHTML = "";


    categories.forEach(category => {

      const button =
        document.createElement("button");

      button.className =
        "category-button";

      if (category === selectedCategory) {
        button.classList.add("active");
      }

      button.textContent = category;


      button.addEventListener("click", () => {

        selectedCategory = category;

        createCategories();
        renderProducts();

      });


      categoriesContainer.appendChild(button);

    });

  }



  function renderProducts() {

    const search =
      searchInput.value
        .trim()
        .toLowerCase();


    const filteredProducts =
      products.filter(product => {

        const name =
          (product.name || "").toLowerCase();

        const category =
          (product.category || "").toLowerCase();

        const description =
          (product.description || "").toLowerCase();

        const keywords =
          (product.keywords || "").toLowerCase();


        const matchesSearch =
          !search ||
          name.includes(search) ||
          category.includes(search) ||
          description.includes(search) ||
          keywords.includes(search);


        const matchesCategory =
          selectedCategory === "Alle" ||
          product.category === selectedCategory;


        return matchesSearch && matchesCategory;

      });


    productsContainer.innerHTML = "";


    if (filteredProducts.length === 0) {

      productsContainer.innerHTML = `
        <div class="no-results">
          Kein passendes Produkt gefunden.
        </div>
      `;

      return;
    }



    filteredProducts.forEach(product => {

      const card =
        document.createElement("div");

      card.className =
        "product-card";


      /*
        PRODUKTBILD

        Wenn image_url in Supabase leer/NULL ist,
        wird einfach kein Bild angezeigt.
      */

      if (product.image_url) {

        const image =
          document.createElement("img");

        image.className =
          "product-image";

        image.src =
          product.image_url;

        image.alt =
          product.name || "Produkt";

        image.loading =
          "lazy";


        image.onerror = function() {
          this.style.display = "none";
        };


        card.appendChild(image);

      }



      const content =
        document.createElement("div");

      content.className =
        "product-content";



      if (product.category) {

        const category =
          document.createElement("div");

        category.className =
          "category-label";

        category.textContent =
          product.category;

        content.appendChild(category);

      }



      const title =
        document.createElement("h2");

      title.textContent =
        product.name || "Produkt";

      content.appendChild(title);



      if (product.description) {

        const description =
          document.createElement("p");

        description.className =
          "description";

        description.textContent =
          product.description;

        content.appendChild(description);

      }



      /*
        WICHTIG:

        Deine Supabase-Spalte heißt LINK.

        Deshalb benutzen wir hier:
        product.link
      */

      if (product.link) {

        const link =
          document.createElement("a");

        link.className =
          "product-link";

        link.href =
          product.link;

        link.target =
          "_blank";

        link.rel =
          "noopener noreferrer";

        link.textContent =
          "Zum Produkt →";

        content.appendChild(link);

      }



      card.appendChild(content);

      productsContainer.appendChild(card);

    });

  }



  searchInput.addEventListener(
    "input",
    renderProducts
  );


  loadProducts();

</script>

</body>
</html>
