<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FindoraHome</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f7f7;
      color: #1f1f1f;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      background: #ffffff;
      text-align: center;
      padding: 20px 20px 18px;
      border-bottom: 1px solid #e5e5e5;
    }

    .site-logo {
      width: 52px;
      height: 52px;
      margin: 0 auto 7px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 14px;
      background: #f1f1f1;

      font-size: 27px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.1;
    }

    header p {
      margin: 7px 0 0;
      font-size: 15px;
      color: #666;
    }


    /* =========================
       HAUPTBEREICH
    ========================= */

    main {
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;
      padding: 24px 30px 45px;
    }


    /* =========================
       SUCHE
    ========================= */

    .search-area {
      width: 100%;
    }

    #search {
      display: block;
      width: 100%;
      height: 48px;

      padding: 0 16px;

      border: 1px solid #d4d4d4;
      border-radius: 10px;

      background: #ffffff;

      font-size: 15px;
      color: #222;

      outline: none;
    }

    #search:focus {
      border-color: #777;
    }


    /* =========================
       KATEGORIEN
    ========================= */

    #categories {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;

      margin: 15px 0 22px;
    }

    .category-button {
      border: 1px solid #dddddd;
      background: #ffffff;
      color: #222;

      padding: 8px 14px;

      border-radius: 999px;

      font-size: 13px;
      cursor: pointer;
    }

    .category-button:hover {
      background: #f0f0f0;
    }

    .category-button.active {
      background: #222222;
      color: #ffffff;
      border-color: #222222;
    }


    /* =========================
       PRODUKTE

       HIER SIND JETZT FEST
       4 KARTEN NEBENEINANDER
    ========================= */

    #products {
      width: 100%;

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 16px;

      align-items: stretch;
    }


    /* =========================
       PRODUKTKARTE
    ========================= */

    .product-card {
      width: 100%;
      min-width: 0;

      background: #ffffff;

      border: 1px solid #e1e1e1;
      border-radius: 12px;

      overflow: hidden;

      display: flex;
      flex-direction: column;

      box-shadow:
        0 2px 7px rgba(0, 0, 0, 0.04);
    }


    /* =========================
       PRODUKTBILD
    ========================= */

    .product-image-box {
      width: 100%;
      height: 155px;

      background: #fafafa;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      border-bottom: 1px solid #eeeeee;
    }

    .product-image {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;

      padding: 10px;
    }

    .image-placeholder {
      color: #aaaaaa;
      font-size: 12px;
    }


    /* =========================
       KARTENINHALT
    ========================= */

    .product-body {
      padding: 12px;

      display: flex;
      flex-direction: column;

      flex: 1;
    }

    .product-category {
      align-self: flex-start;

      margin-bottom: 7px;

      padding: 4px 8px;

      background: #f1f1f1;

      border-radius: 999px;

      font-size: 11px;
      color: #555555;
    }

    .product-name {
      margin: 0 0 7px;

      font-size: 17px;
      line-height: 1.25;

      color: #1f1f1f;
    }

    .product-description {
      margin: 0 0 12px;

      font-size: 13px;
      line-height: 1.45;

      color: #666666;
    }


    /* =========================
       PRODUKT BUTTON
    ========================= */

    .product-link {
      display: block;

      width: 100%;

      margin-top: auto;

      padding: 9px 10px;

      background: #222222;
      color: #ffffff;

      border-radius: 7px;

      text-decoration: none;
      text-align: center;

      font-size: 13px;
      font-weight: bold;

      cursor: pointer;
    }

    .product-link:hover {
      background: #444444;
    }


    /* =========================
       MELDUNGEN
    ========================= */

    .message {
      grid-column: 1 / -1;

      padding: 35px 15px;

      text-align: center;

      color: #777777;
      font-size: 14px;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
      padding: 25px 20px 35px;

      text-align: center;

      color: #888888;
      font-size: 12px;
    }


    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 1000px) {

      #products {
        grid-template-columns:
          repeat(3, 1fr);
      }

    }


    @media (max-width: 750px) {

      main {
        padding:
          20px 18px 40px;
      }

      #products {
        grid-template-columns:
          repeat(2, 1fr);
      }

    }


    @media (max-width: 480px) {

      header h1 {
        font-size: 26px;
      }

      header p {
        font-size: 13px;
      }

      main {
        padding:
          18px 12px 35px;
      }

      #products {
        grid-template-columns:
          1fr;
      }

      .product-image-box {
        height: 180px;
      }

    }
  </style>
</head>


<body>


  <!-- =========================
       HEADER
  ========================== -->

  <header>

    <div class="site-logo">
      🏠
    </div>

    <h1>FindoraHome</h1>

    <p>
      Finde Produkte für dein Zuhause
    </p>

  </header>


  <!-- =========================
       HAUPTBEREICH
  ========================== -->

  <main>

    <div class="search-area">

      <input
        id="search"
        type="search"
        placeholder="Produkt, Kategorie oder Stichwort suchen..."
        autocomplete="off"
      >

    </div>


    <div id="categories"></div>


    <section id="products">

      <div class="message">
        Produkte werden geladen...
      </div>

    </section>

  </main>


  <footer>
    © FindoraHome
  </footer>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script>

    /*
      SUPABASE
    */

    const SUPABASE_URL =
      "https://wcpifcdwomjzmvnvgqwr.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_E2eo9QKlcUtWkpVuRPOmPw_n95EvT0i";


    /*
      VARIABLEN
    */

    let allProducts = [];

    let selectedCategory =
      "Alle";


    const productsElement =
      document.getElementById("products");

    const categoriesElement =
      document.getElementById("categories");

    const searchElement =
      document.getElementById("search");


    /*
      PRODUKTE AUS SUPABASE LADEN
    */

    async function loadProducts() {

      productsElement.innerHTML =
        '<div class="message">Produkte werden geladen...</div>';


      try {

        const url =
          SUPABASE_URL +
          "/rest/v1/products" +
          "?select=*" +
          "&active=eq.true" +
          "&order=id.asc";


        const response =
          await fetch(
            url,
            {
              method: "GET",

              headers: {
                "apikey":
                  SUPABASE_KEY,

                "Authorization":
                  "Bearer " +
                  SUPABASE_KEY
              }
            }
          );


        if (!response.ok) {

          throw new Error(
            "Supabase Fehler: " +
            response.status
          );

        }


        allProducts =
          await response.json();


        buildCategories();

        renderProducts();


      } catch (error) {

        console.error(error);


        productsElement.innerHTML =
          '<div class="message">' +
          'Produkte konnten nicht geladen werden.' +
          '</div>';

      }

    }


    /*
      KATEGORIEN ERSTELLEN
    */

    function buildCategories() {

      const categoryList =
        allProducts
          .map(function(product) {

            return product.category;

          })
          .filter(function(category) {

            return Boolean(category);

          });


      const uniqueCategories =
        [...new Set(categoryList)];


      const categories =
        [
          "Alle",
          ...uniqueCategories
        ];


      categoriesElement.innerHTML =
        "";


      categories.forEach(
        function(category) {


          const button =
            document.createElement(
              "button"
            );


          button.type =
            "button";


          button.className =
            "category-button";


          button.textContent =
            category;


          if (
            category ===
            selectedCategory
          ) {

            button.classList.add(
              "active"
            );

          }


          button.addEventListener(
            "click",
            function() {

              selectedCategory =
                category;

              buildCategories();

              renderProducts();

            }
          );


          categoriesElement.appendChild(
            button
          );

        }
      );

    }


    /*
      PRODUKTE FILTERN
    */

    function getFilteredProducts() {

      const searchText =
        searchElement
          .value
          .trim()
          .toLowerCase();


      return allProducts.filter(
        function(product) {


          const name =
            product.name || "";


          const category =
            product.category || "";


          const description =
            product.description || "";


          const keywords =
            product.keywords || "";


          const combinedText =
            (
              name +
              " " +
              category +
              " " +
              description +
              " " +
              keywords
            ).toLowerCase();


          const searchMatches =
            combinedText.includes(
              searchText
            );


          const categoryMatches =

            selectedCategory ===
              "Alle"

            ||

            category ===
              selectedCategory;


          return (
            searchMatches &&
            categoryMatches
          );

        }
      );

    }


    /*
      PRODUKTE ANZEIGEN
    */

    function renderProducts() {

      const products =
        getFilteredProducts();


      productsElement.innerHTML =
        "";


      if (
        products.length === 0
      ) {

        productsElement.innerHTML =
          '<div class="message">' +
          'Kein passendes Produkt gefunden.' +
          '</div>';

        return;

      }


      products.forEach(
        function(product) {


          /*
            KARTE
          */

          const card =
            document.createElement(
              "article"
            );


          card.className =
            "product-card";


          /*
            BILDBEREICH
          */

          const imageBox =
            document.createElement(
              "div"
            );


          imageBox.className =
            "product-image-box";


          if (
            product.image_url &&
            product.image_url.trim() !== ""
          ) {


            const image =
              document.createElement(
                "img"
              );


            image.className =
              "product-image";


            image.src =
              product.image_url;


            image.alt =
              product.name ||
              "Produktbild";


            image.loading =
              "lazy";


            image.addEventListener(
              "error",
              function() {

                imageBox.innerHTML =
                  '<span class="image-placeholder">' +
                  'Bild konnte nicht geladen werden' +
                  '</span>';

              }
            );


            imageBox.appendChild(
              image
            );


          } else {


            imageBox.innerHTML =
              '<span class="image-placeholder">' +
              'Bild fehlt' +
              '</span>';

          }


          card.appendChild(
            imageBox
          );


          /*
            INHALT
          */

          const body =
            document.createElement(
              "div"
            );


          body.className =
            "product-body";


          /*
            KATEGORIE
          */

          if (product.category) {

            const category =
              document.createElement(
                "div"
              );


            category.className =
              "product-category";


            category.textContent =
              product.category;


            body.appendChild(
              category
            );

          }


          /*
            NAME
          */

          const name =
            document.createElement(
              "h2"
            );


          name.className =
            "product-name";


          name.textContent =
            product.name ||
            "Produkt";


          body.appendChild(
            name
          );


          /*
            BESCHREIBUNG
          */

          if (product.description) {

            const description =
              document.createElement(
                "p"
              );


            description.className =
              "product-description";


            description.textContent =
              product.description;


            body.appendChild(
              description
            );

          }


          /*
            PRODUKTLINK

            Supabase-Spalte:
            link
          */

          if (
            product.link &&
            product.link.trim() !== ""
          ) {


            const productLink =
              document.createElement(
                "a"
              );


            productLink.className =
              "product-link";


            productLink.href =
              product.link;


            productLink.target =
              "_blank";


            productLink.rel =
              "noopener noreferrer sponsored";


            productLink.textContent =
              "Zum Produkt →";


            body.appendChild(
              productLink
            );

          }


          card.appendChild(
            body
          );


          productsElement.appendChild(
            card
          );

        }
      );

    }


    /*
      LIVE-SUCHE
    */

    searchElement.addEventListener(
      "input",
      function() {

        renderProducts();

      }
    );


    /*
      START
    */

    loadProducts();

  </script>

</body>
</html>
