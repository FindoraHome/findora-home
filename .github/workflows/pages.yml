name: Publish Findora Home

on:
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/configure-pages@v6.0.0
      - name: Build the storefront
        run: |
          python3 pocketbase/staging/build.py _site \
            --public-origin https://findorahome.github.io/findora-home \
            --api-origin https://findorahome.duckdns.org \
            --caddy-output /tmp/findora-api.Caddyfile
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
      - uses: actions/deploy-pages@v5.0.1
        id: deploy
